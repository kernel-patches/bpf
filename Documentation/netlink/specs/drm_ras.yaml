---
name: drm-ras
protocol: genetlink
uapi-header: drm/drm_ras.h

doc: >-
  DRM RAS (Reliability, Availability, Serviceability) over Generic Netlink.
  Provides a standardized mechanism for DRM drivers to register "nodes"
  representing hardware/software components capable of reporting error counters.
  Userspace tools can query the list of nodes or individual error counters
  via the Generic Netlink interface.

definitions:
  -
    type: enum
    name: node-type
    value-start: 1
    entries: [error-counter, telemetry]
    doc: >-
         Type of the node. The error-counter nodes expose reliability counters
         for a hardware/software component, and telemetry nodes expose an
         interface for reading and writing telemetry values to a device.
  -
    type: flags
    name: telemetry-field-mode
    entries: [read, write]
    doc: Bitmask of access modes supported by a telemetry field.

attribute-sets:
  -
    name: node-attrs
    attributes:
      -
        name: node-id
        type: u32
        doc: >-
             Unique identifier for the node.
             Assigned dynamically by the DRM RAS core upon registration.
      -
        name: device-name
        type: string
        doc: >-
             Device name chosen by the driver at registration.
             Can be a PCI BDF, UUID, or module name if unique.
      -
        name: node-name
        type: string
        doc: >-
             Node name chosen by the driver at registration.
             Can be an IP block name, or any name that identifies the
             RAS node inside the device.
      -
        name: node-type
        type: u32
        doc: Type of this node, identifying its function.
        enum: node-type
  -
    name: error-counter-attrs
    attributes:
      -
        name: node-id
        type: u32
        doc: Node ID targeted by this error counter operation.
      -
        name: error-id
        type: u32
        doc: Unique identifier for a specific error counter within an node.
      -
        name: error-name
        type: string
        doc: Name of the error.
      -
        name: error-value
        type: u32
        doc: Current value of the requested error counter.
      -
        name: error-threshold
        type: u32
        doc: Error threshold of the counter.
  -
    name: error-event-attrs
    attributes:
      -
        name: device-name
        type: string
        doc: Device (PCI BDF, UUID) that reported the error.
      -
        name: node-id
        type: u32
        doc: ID of the node that reported the error.
      -
        name: node-name
        type: string
        doc: Name of the node that reported the error.
      -
        name: error-id
        type: u32
        doc: ID of the error counter.
      -
        name: error-name
        type: string
        doc: Name of the error.
      -
        name: error-value
        type: u32
        doc: Current value of the error counter.
  -
    name: telemetry-attrs
    attributes:
      -
        name: node-id
        type: u32
        doc: >-
             Unique identifier for the node.
             Assigned dynamically by the DRM RAS core upon registration.
      -
        name: field
        type: uint
        doc:  Telemetry field to be read/written, e.g., SoC temp.
      -
        name: field-name
        type: string
        doc:  Name of the telemetry field defined by the device's uAPI.
      -
        name: value
        type: sint
        doc: Value of telemetry field that was read/written.
      -
        name: status
        type: sint
        doc: >-
             Status of the telemetry operation.
             Populated by the device in response to the performed
             telemetry operation. Errors may be hardware specific.
      -
        name: mode
        type: uint
        enum: telemetry-field-mode
        doc: >-
             Bitmask of access modes (read/write) supported by the
             telemetry field.

operations:
  list:
    -
      name: list-nodes
      doc: >-
           Retrieve the full list of currently registered DRM RAS nodes.
           Each node includes its dynamically assigned ID, name, and type.
           **Important:** User space must call this operation first to obtain
           the node IDs. These IDs are required for all subsequent
           operations on nodes, such as querying error counters.
      attribute-set: node-attrs
      dump:
        reply:
          attributes:
            - node-id
            - device-name
            - node-name
            - node-type
    -
      name: get-error-counter
      doc: >-
           Retrieve error counter for a given node.
           The response includes the id, the name, and even the current
           value of each counter.
      attribute-set: error-counter-attrs
      flags: [admin-perm]
      do:
        request:
          attributes: &id-attrs
            - node-id
            - error-id
        reply:
          attributes: &errorinfo
            - error-id
            - error-name
            - error-value
      dump:
        request:
          attributes:
            - node-id
        reply:
          attributes: *errorinfo
    -
      name: clear-error-counter
      doc: >-
           Clear error counter for a given node.
           The request includes the error-id and node-id of the
           counter to be cleared.
      attribute-set: error-counter-attrs
      flags: [admin-perm]
      do:
        request:
          attributes: *id-attrs
    -
      name: error-event
      doc: >-
           Report an error event to userspace.
           The event includes the device, node and error information
           of the error that triggered the event.
      attribute-set: error-event-attrs
      mcgrp: error-report
      event:
        attributes:
          - device-name
          - node-id
          - node-name
          - error-id
          - error-name
          - error-value
    -
      name: get-error-threshold
      doc: >-
           Retrieve error threshold of a given counter.
           The response includes the id, the name, and current threshold
           of the counter.
      attribute-set: error-counter-attrs
      flags: [admin-perm]
      do:
        request:
          attributes: *id-attrs
        reply:
          attributes:
            - error-id
            - error-name
            - error-threshold
    -
      name: set-error-threshold
      doc: >-
           Set error threshold of a given counter.
      attribute-set: error-counter-attrs
      flags: [admin-perm]
      do:
        request:
          attributes:
            - node-id
            - error-id
            - error-threshold
    -
      name: telemetry-get
      doc: Perform a read of the specified telemetry field.
      attribute-set: telemetry-attrs
      do:
        pre: drm-ras-nl-pre-telemetry
        post: drm-ras-nl-post-telemetry
        request:
          attributes:
            - node-id
            - field
        reply:
          attributes:
            - value
            - status
    -
      name: telemetry-set
      doc: >-
           Perform a write of the specified telemetry field.
           Telemetry writes are device specific, and may be used to set
           device limits or other capacities, for example.
      attribute-set: telemetry-attrs
      flags: [admin-perm]
      do:
        pre: drm-ras-nl-pre-telemetry
        post: drm-ras-nl-post-telemetry
        request:
          attributes:
            - node-id
            - field
            - value
        reply:
          attributes:
            - status
    -
      name: telemetry-list-fields
      doc: >-
           Enumerate the telemetry fields exposed by a node, reporting each
           field's value, name, and supported access modes (read/write).
      attribute-set: telemetry-attrs
      dump:
        request:
          attributes:
            - node-id
        reply:
          attributes:
            - field
            - field-name
            - mode

mcast-groups:
  list:
    -
      name: error-report
