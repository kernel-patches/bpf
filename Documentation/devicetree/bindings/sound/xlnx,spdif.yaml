%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/xlnx,spdif.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx SPDIF IP

description:
  The IP supports playback and capture of SPDIF audio.

maintainers:
  - Vincenzo Frascino <vincenzo.frascino@arm.com>

allOf:
  - $ref: dai-common.yaml#
  - if:
      properties:
        xlnx,spdif-mode:
          const: 1
      required:
        - xlnx,spdif-mode
    then:
      properties:
        clock-names:
          minItems: 2
          items:
            - const: aud_clk_i
            - const: s_axi_aclk
            - const: s_axis_aclk
    else:
      properties:
        clock-names:
          minItems: 2
          items:
            - const: aud_clk_i
            - const: s_axi_aclk
            - const: m_axis_aclk

properties:
  compatible:
    enum:
      - xlnx,spdif-2.0

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: SPDIF audio interrupt

  clock-names:
    minItems: 2
    maxItems: 3

  clocks:
    minItems: 2
    items:
      - description: Audio clock input used at the SPDIF/AES3 interface
      - description: AXI4-Lite clock
      - description: AXI4-Stream clock

  xlnx,spdif-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum:
      - 0
      - 1
    description: |
      0 - receiver
      1 - transmitter

  xlnx,aud_clk_i:
    $ref: /schemas/types.yaml#/definitions/uint32
    deprecated: true
    description:
      Frequency of the audio clock input. Superseded by the rate of the
      clock named aud_clk_i.

required:
  - compatible
  - reg
  - interrupts
  - clock-names
  - clocks
  - xlnx,spdif-mode

additionalProperties: false

examples:
  - |
    spdif@80010000 {
      compatible = "xlnx,spdif-2.0";
      reg = <0x80010000 0x10000>;
      clock-names = "aud_clk_i", "s_axi_aclk", "s_axis_aclk";
      clocks = <&misc_clk_0>, <&clk 71>, <&misc_clk_0>;
      interrupt-parent = <&gic>;
      interrupts = <0 91 4>;
      xlnx,spdif-mode = <1>;
    };
  - |
    spdif@80090000 {
      compatible = "xlnx,spdif-2.0";
      reg = <0x80090000 0x10000>;
      clock-names = "aud_clk_i", "s_axi_aclk", "m_axis_aclk";
      clocks = <&misc_clk_0>, <&clk 71>, <&clk 71>;
      interrupt-parent = <&gic>;
      interrupts = <0 90 4>;
      xlnx,spdif-mode = <0>;
    };

...
