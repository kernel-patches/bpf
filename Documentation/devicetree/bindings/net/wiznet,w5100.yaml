%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wiznet,w5100.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Wiznet w5100/w5200/w5500 SPI Ethernet Controller

maintainers:
  - Arthur Crepin Leblond <arthur@marmottus.net>

description: |
  This is a standalone 10/100 MBit Ethernet controller with SPI interface.

allOf:
  - $ref: /schemas/net/ethernet-controller.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    enum:
      - wiznet,w5100
      - wiznet,w5200
      - wiznet,w5500

  interrupts:
    maxItems: 1

  reg:
    maxItems: 1

  spi-max-frequency:
    description:
      According to the w5500 datasheet, the chip allows a maximum of 80 MHz,
      however, board designs may need to limit this value.
    maximum: 80000000

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    /* Example (for Raspberry Pi with pin control stuff for GPIO irq) */

    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet@0 {
            compatible = "wiznet,w5500";
            reg = <0>;
            pinctrl-names = "default";
            pinctrl-0 = <&eth1_pins>;
            interrupt-parent = <&gpio>;
            interrupts = <25 IRQ_TYPE_EDGE_FALLING>;
            spi-max-frequency = <30000000>;
            local-mac-address = [ a0 b0 c0 d0 e0 f0 ];
        };
    };
...
