%YAML 1.2
---
$id: http://devicetree.org/schemas/net/motorcomm,yt8824.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MotorComm YT8824 Ethernet PHY

maintainers:
  - Kyle Switch <kyle.switch@motor-comm.com>

description:
  Motorcomm YT8824 Ethernet PHY is a PHY package of 4 PHYs.

$ref: ethernet-phy-package.yaml#

properties:
  compatible:
    enum:
      - motorcomm,yt8824-package

required:
  - compatible
  - phy-mode
  - reg

unevaluatedProperties: false

examples:
  - |
    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy-package@0 {
            #address-cells = <1>;
            #size-cells = <0>;
            compatible = "motorcomm,yt8824-package";
            reg = <9>;

            phy-mode = "internal";

            ethernet-phy@4 {
                reg = <4>;
            };

            ethernet-phy@5 {
                reg = <5>;
            };

            ethernet-phy@6 {
                reg = <6>;
            };

            ethernet-phy@7 {
                reg = <7>;
            };
        };
    };
