%YAML 1.2
---
$id: http://devicetree.org/schemas/net/realtek,rtl82xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL82xx PHY

maintainers:
  - Andrew Lunn <andrew@lunn.ch>
  - Florian Fainelli <f.fainelli@gmail.com>
  - Heiner Kallweit <hkallweit1@gmail.com>

description:
  Bindings for Realtek RTL82xx PHYs.

  The RTL8224 contains four PHYs at consecutive MDIO addresses. Its PHY
  nodes may be grouped under an ethernet-phy-package node as described
  in ethernet-phy-package.yaml. The package reg must identify the first
  PHY's MDIO address, even if that PHY has no child node. This address
  need not be a multiple of four. Each child PHY reg is its absolute
  MDIO address, not an offset from the package base.

  The enet-phy-pair-order and enet-phy-pair-polarity properties belong
  to the individual PHY nodes and describe each port's MDI wiring.

properties:
  compatible:
    enum:
      - ethernet-phy-id001c.c800
      - ethernet-phy-id001c.c816
      - ethernet-phy-id001c.c838
      - ethernet-phy-id001c.c840
      - ethernet-phy-id001c.c848
      - ethernet-phy-id001c.c849
      - ethernet-phy-id001c.c84a
      - ethernet-phy-id001c.c862
      - ethernet-phy-id001c.c878
      - ethernet-phy-id001c.c880
      - ethernet-phy-id001c.c910
      - ethernet-phy-id001c.c912
      - ethernet-phy-id001c.c913
      - ethernet-phy-id001c.c914
      - ethernet-phy-id001c.c915
      - ethernet-phy-id001c.c916
      - ethernet-phy-id001c.c942
      - ethernet-phy-id001c.c961
      - ethernet-phy-id001c.cad0
      - ethernet-phy-id001c.cb00

  leds: true

  realtek,aldps-enable:
    type: boolean
    description:
      Enable ALDPS mode, ALDPS mode default is disabled after hardware reset.

  realtek,clkout-disable:
    type: boolean
    description:
      Disable CLKOUT clock, CLKOUT clock default is enabled after hardware reset.

  realtek,clkout-ssc-enable:
    type: boolean
    description:
      Enable CLKOUT SSC mode, CLKOUT SSC mode default is disabled after hardware reset.

  realtek,rxc-ssc-enable:
    type: boolean
    description:
      Enable RXC SSC mode, RXC SSC mode default is disabled after hardware reset.

  realtek,sysclk-ssc-enable:
    type: boolean
    description:
      Enable SYSCLK SSC mode, SYSCLK SSC mode default is disabled after hardware reset.

  wakeup-source:
    type: boolean
    description:
      Enable Wake-on-LAN support for the RTL8211F PHY.

unevaluatedProperties: false

allOf:
  - $ref: ethernet-phy.yaml#
  - if:
      not:
        properties:
          compatible:
            contains:
              const: ethernet-phy-id001c.c916
    then:
      properties:
        leds: false

examples:
  - |
    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@1 {
            reg = <1>;
            realtek,aldps-enable;
            realtek,clkout-disable;
        };
    };
  - |
    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy-package@1 {
            reg = <1>;
            #address-cells = <1>;
            #size-cells = <0>;

            ethernet-phy@1 {
                compatible = "ethernet-phy-ieee802.3-c45";
                reg = <1>;
                enet-phy-pair-order = <0>;
            };

            ethernet-phy@2 {
                compatible = "ethernet-phy-ieee802.3-c45";
                reg = <2>;
                enet-phy-pair-order = <0>;
            };

            ethernet-phy@3 {
                compatible = "ethernet-phy-ieee802.3-c45";
                reg = <3>;
                enet-phy-pair-order = <1>;
            };

            ethernet-phy@4 {
                compatible = "ethernet-phy-ieee802.3-c45";
                reg = <4>;
                enet-phy-pair-order = <1>;
                enet-phy-pair-polarity = <0x1>;
            };
        };
    };
