%YAML 1.2
---
$id: http://devicetree.org/schemas/net/maxlinear,gpy2xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MaxLinear GPY2xx PHY

maintainers:
  - Andrew Lunn <andrew@lunn.ch>
  - Michael Walle <michael@walle.cc>

allOf:
  - $ref: ethernet-phy.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: ethernet-phy-idc133.5400
      required:
        - compatible

    then:
      properties:
        maxlinear,lane-asp-map:
          description: |
            Mapping of the physical TPI lanes A through D to the PHY's
            analog signal processing lanes (ASPs). The array index identifies
            physical lane A, B, C, or D, while its value identifies ASP A, B,
            C, or D, encoded as 0 through 3. Each ASP must be mapped exactly
            once. Omit the property to retain the hardware reset mapping.
          $ref: /schemas/types.yaml#/definitions/uint32-array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            minimum: 0
            maximum: 3

        mdio-regulator:
          type: object
          description: |
            Initial data for the MxL86211C MDIO I/O voltage regulator. Set
            this to 1.8 V or 3.3 V to configure the MDIO, MDC, and MDINT
            pad voltage. The board must supply the VDDP pin at the selected
            voltage.
          $ref: /schemas/regulator/regulator.yaml#
          unevaluatedProperties: false

    else:
      properties:
        maxlinear,lane-asp-map: false
        mdio-regulator: false

properties:
  maxlinear,use-broken-interrupts:
    description: |
      Interrupts are broken on some GPY2xx PHYs in that they keep the
      interrupt line asserted for a random amount of time even after the
      interrupt status register is cleared. Thus it is blocking the
      interrupt line which is usually bad for shared lines. By default,
      interrupts are disabled for this PHY and polling mode is used. If one
      can live with the consequences, this property can be used to enable
      interrupt handling.

      Affected PHYs (as far as known) are GPY215B and GPY215C.
    type: boolean

dependencies:
  maxlinear,use-broken-interrupts: [ interrupts ]

unevaluatedProperties: false

examples:
  - |
    ethernet {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
            reg = <0>;
            interrupts-extended = <&intc 0>;
            maxlinear,use-broken-interrupts;
        };
    };

  - |
    ethernet {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
            compatible = "ethernet-phy-idc133.5400",
                         "ethernet-phy-ieee802.3-c45";
            reg = <0>;

            /* Swap physical TPI lanes C and D. */
            maxlinear,lane-asp-map = <0 1 3 2>;

            mdio: mdio-regulator {
                regulator-min-microvolt = <1800000>;
                regulator-max-microvolt = <1800000>;
            };
        };
    };

...
