# AI shadow: production's ai-code-review.yml plus an experiment, run on a
# sample of KPD's series PRs in kernel-patches/bpf-rc and on test PRs against
# its ai-review-base branch. Reviews are posted to bpf-rc PRs only.
#
# Keep this file equal to ai-code-review.yml apart from the experiment:
# port every change to ai-code-review.yml here too.
name: AI Code Review (rc)

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    types: [opened, review_requested]

env:
  # The experiment: the bpf-ai-review ref to review with.
  AI_REVIEW_WRAPPER_REF: shadow/subsystem-build
  # Review one in N KPD series.
  AI_REVIEW_SAMPLE_EVERY: 4

jobs:
  get-commits-rc:
    # This codition is an indicator that we are running in a context of PR owned by kernel-patches org
    if: ${{ github.repository == 'kernel-patches/bpf-rc' && vars.AWS_REGION }}
    runs-on:
      - ${{ format('codebuild-bpf-ci-{0}-{1}', github.run_id, github.run_attempt) }}
      - image:custom-linux-ghcr.io/kernel-patches/runner:kbuilder-debian-x86_64
      - instance-size:small
    continue-on-error: true
    outputs:
      commits: ${{ steps.get-commits.outputs.commits }}
      has-commits: ${{ steps.get-commits.outputs.has-commits }}
    steps:

      - name: Download Linux source tree
        uses: libbpf/ci/get-linux-source@v4
        with:
          repo: ${{ github.event.pull_request.head.repo.clone_url }}
          rev: ${{ github.event.pull_request.head.sha }}
          dest: .kernel
        env:
          REFERENCE_REPO_PATH: /libbpfci/mirrors/linux
          FETCH_DEPTH: 100

      # Get the list of commits and trigger a review job for each separate commit
      # As a safeguard, check no more than the first 50 commits
      - name: Get PR commits
        id: get-commits
        run: |
          # Review one in AI_REVIEW_SAMPLE_EVERY KPD series, by patchwork series
          # ID. Test PRs against ai-review-base always run.
          if [ "$GITHUB_BASE_REF" != ai-review-base ]; then
            if ! [[ $GITHUB_HEAD_REF =~ ^series/([0-9]+)= ]] ||
               (( BASH_REMATCH[1] % AI_REVIEW_SAMPLE_EVERY )); then
              echo "::notice::$GITHUB_HEAD_REF is not sampled (1 in ${AI_REVIEW_SAMPLE_EVERY} series)"
              echo "commits=[]" >> "$GITHUB_OUTPUT"
              echo "has-commits=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          cd .kernel
          if [ "$(git log -1 --format=%s ${{ github.event.pull_request.head.sha }})" = "Dummy commit" ]; then
            echo "::notice::KPD Dummy commit, the series did not apply: skipping AI review"
            echo "commits=[]" >> $GITHUB_OUTPUT
            echo "has-commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          tmp=$(mktemp)
          git rev-list --max-count=50 ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} > pr_commits.txt
          cat pr_commits.txt | jq -R -s -c 'split("\n")[:-1]' > $tmp
          echo "commits=$(cat $tmp)" >> $GITHUB_OUTPUT
          echo "has-commits=$([ -s pr_commits.txt ] && echo true || echo false)" >> $GITHUB_OUTPUT

  ai-review-rc:
    needs: get-commits-rc
    if: needs.get-commits-rc.outputs.has-commits == 'true'
    timeout-minutes: 120
    runs-on:
      - ${{ format('codebuild-bpf-ci-{0}-{1}', github.run_id, github.run_attempt) }}
      - image:custom-linux-ghcr.io/kernel-patches/runner:ai-review
      - instance-size:large
    strategy:
      matrix:
        commit: ${{ fromJson(needs.get-commits-rc.outputs.commits) }}
      fail-fast: false
    env:
      AWS_REGION: us-west-2
    steps:
      - name: Checkout CI code
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            ci

      - name: Set up .claude/settings.json
        shell: bash
        run: |
          mkdir -p ~/.claude
          cp ci/claude/settings.json ~/.claude/settings.json

      - name: Download Linux source tree
        uses: libbpf/ci/get-linux-source@v4
        with:
          repo: ${{ github.event.pull_request.head.repo.clone_url }}
          rev: ${{ github.event.pull_request.head.sha }}
          dest: .kernel
        env:
          REFERENCE_REPO_PATH: /libbpfci/mirrors/linux
          FETCH_DEPTH: 0

      # This manipulation is necessary to make sure that
      # ${{ github.workspace }} is the root of the Linux git repo.
      #
      # The AI review config lives in ci/, which is present on every *_base
      # branch and thus in this checkout (the pull_request merge ref), but not
      # necessarily in the PR head tree fetched above (get-linux-source pulls
      # head.sha only). Preserve the checked-out ci/ across the move instead of
      # deleting it, dropping only the head tree's own ci/ to avoid a collision,
      # so the config is available regardless of whether the head carries it.
      - name: Move linux source in place
        shell: bash
        run: |
          rm -rf .git .github
          cd .kernel
          rm -rf ci
          mv -t .. $(ls -A)
          cd ..
          rmdir .kernel

      - name: Find production's review
        id: prod-review
        if: startsWith(github.head_ref, 'series/')
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: 'kernel-patches',
              repo: 'bpf',
              workflow_id: 'ai-code-review.yml',
              branch: context.payload.pull_request.head.ref,
              event: 'pull_request',
              per_page: 100,
            });
            const runs = data.workflow_runs.sort((a, b) => a.created_at.localeCompare(b.created_at));
            if (runs.length) {
              core.setOutput('created_at', runs[0].created_at);
              core.setOutput('url', runs[0].html_url);
            }

      - name: semcode-index
        timeout-minutes: 30
        shell: bash
        env:
          # semcode-index --lore fetches into the lore archive baked into the
          # image, and gitoxide needs a committer to update the reflog.
          GIT_COMMITTER_NAME: semcode-index
          GIT_COMMITTER_EMAIL: semcode-index@localhost
          PROD_REVIEW_OUTCOME: ${{ steps.prod-review.outcome }}
          PROD_REVIEW_AT: ${{ steps.prod-review.outputs.created_at }}
          PROD_REVIEW_URL: ${{ steps.prod-review.outputs.url }}
        run: |
          git fetch --no-tags https://github.com/kernel-patches/bpf.git bpf-next
          git checkout ${{ matrix.commit }} -b patch-series.local
          MERGE_BASE=$(git merge-base FETCH_HEAD HEAD)
          ln -s /ci/.semcode.db ${{ github.workspace }}/.semcode.db
          semcode-index --git "${MERGE_BASE}..HEAD"
          # Index lore only up to the start of production's review of the
          # same series, so that the shadow review sees neither production's
          # review mail nor the replies after it. semcode indexes each lore
          # clone from origin/master after fetching origin: fetch here, move
          # both master refs back to the cutoff, and make the clone its own
          # origin.
          if [ "$PROD_REVIEW_OUTCOME" = failure ]; then
            echo "::warning::Looking up production's review failed: lore not cut"
          elif [ -z "$PROD_REVIEW_AT" ]; then
            echo "::notice::No production review of $GITHUB_HEAD_REF: lore not cut"
          else
            echo "Production review: $PROD_REVIEW_URL; lore cut at $PROD_REVIEW_AT"
            for lore in .semcode.db/lore/bpf/*/; do
              baked=$(git -C "$lore" log -1 --format=%ct refs/remotes/origin/master)
              git -C "$lore" fetch -q origin
              cut=$(git -C "$lore" rev-list -1 --before="$PROD_REVIEW_AT" refs/remotes/origin/master)
              git -C "$lore" update-ref refs/heads/master "$cut"
              git -C "$lore" update-ref refs/remotes/origin/master "$cut"
              git -C "$lore" remote set-url origin "$(realpath "$lore")"
              if [ "$baked" -gt "$(date -d "$PROD_REVIEW_AT" +%s)" ]; then
                echo "::warning::$lore in the image is newer than $PROD_REVIEW_AT:" \
                  "later mail is already indexed"
              fi
            done
          fi
          semcode-index --lore bpf

      - name: Get patch subject
        id: get-patch-subject
        shell: bash
        run: |
          subject=$(git log -1 --pretty=format:"%s" ${{ matrix.commit }})
          echo "subject=$subject" >> $GITHUB_OUTPUT

      - name: Checkout AI review configuration
        uses: actions/checkout@v6
        with:
          repository: 'kernel-patches/bpf-ai-review'
          path: 'bpf-ai-review'
          ref: ${{ env.AI_REVIEW_WRAPPER_REF }}
          submodules: true

      - name: Set up AI review
        id: setup-ai-review
        shell: bash
        env:
          SHA: ${{ matrix.commit }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bpf-ai-review/setup.sh ${{ github.workspace }} "$RUNNER_TEMP/trigger.md"
          rm -rf bpf-ai-review
          {
            echo 'prompt<<EOF_TRIGGER_PROMPT'
            cat "$RUNNER_TEMP/trigger.md"
            echo 'EOF_TRIGGER_PROMPT'
          } >> "$GITHUB_OUTPUT"

      # The review scripts need them; the runner:ai-review image lacks both.
      - name: Install python3 and jq
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 jq

      # orc.md skips the context agent when review-context/index.json exists.
      - name: Create review context
        shell: bash
        env:
          SHA: ${{ matrix.commit }}
        run: |
          timeout 300 python3 review/scripts/create_changes.py "$SHA" -o review-context || {
            rm -rf review-context
            echo "::warning::create_changes.py failed, the context agent will run"
          }

      # The STS session lasts an hour: start it right before Claude Code,
      # not before the setup steps. Raise the Claude Code timeout with it.
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          aws-region: us-west-2

      - uses: anthropics/claude-code-action@v1
        timeout-minutes: 65
        with:
          show_full_output: true
          # Keep the review bot's App token out of the agent's environment.
          github_token: ${{ github.token }}
          use_bedrock: "true"
          claude_args: |
            --max-turns 100
            --mcp-config ci/claude/mcp.json
            --model global.anthropic.claude-opus-5-5
            --effort xhigh
          allowed_bots: "kernel-patches-daemon-bpf,kernel-patches-review-bot"
          prompt: ${{ steps.setup-ai-review.outputs.prompt }}

      # If Claude produced review-inline.txt then it found something
      # Post a comment on PR and fail the job
      - name: Check review-inline.txt and review-metadata.json
        id: check_review
        shell: bash
        run: |
          review_file=$(find ${{ github.workspace }} -name review-inline.txt)
          if [ -s "$review_file" ]; then
              cat $review_file || true
              cp "$review_file" "$RUNNER_TEMP/review-inline.txt"
              echo "review_file=$RUNNER_TEMP/review-inline.txt" >> $GITHUB_OUTPUT
          fi
          review_metadata=$(find ${{ github.workspace }} -name review-metadata.json -print -quit)
          if [ -s "$review_metadata" ]; then
              cat $review_metadata || true
              echo "review_metadata=$review_metadata" >> $GITHUB_OUTPUT
          fi

      - name: Write a TL;DR of the review
        if: steps.check_review.outputs.review_file != '' && steps.setup-ai-review.outputs.tldr_prompt != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          github_token: ${{ github.token }}
          use_bedrock: "true"
          claude_args: |
            --max-turns 5
            --model global.anthropic.claude-sonnet-5-5
          allowed_bots: "kernel-patches-daemon-bpf,kernel-patches-review-bot"
          prompt: ${{ steps.setup-ai-review.outputs.tldr_prompt }}

      - name: Generate GitHub App token
        id: app-token
        if: steps.check_review.outputs.review_file != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KP_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.KP_REVIEW_BOT_APP_PRIVATE_KEY }}

      - name: Comment on PR
        if: steps.check_review.outputs.review_file != ''
        uses: actions/github-script@v8
        env:
          REVIEW_FILE: ${{ steps.check_review.outputs.review_file }}
          REVIEW_METADATA: ${{ steps.check_review.outputs.review_metadata }}
          PATCH_SUBJECT: ${{ steps.get-patch-subject.outputs.subject }}
          TLDR_FILE: ${{ github.workspace }}/review-tldr.txt
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const commentScript = require('./ci/claude/post-pr-comment.js');
            await commentScript({github, context});
            const name = process.env.AI_REVIEW_WRAPPER_REF.replace(/^shadow\//, '');
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [`ai-review-shadow:${name}`],
            });

      - name: Fail CI job if review file exists
        if: steps.check_review.outputs.review_file != ''
        run: |
          echo "Review file found - failing the CI job"
          exit 42

      - name: Fail CI job if the review did not complete
        if: steps.check_review.outputs.review_metadata == ''
        run: |
          git diff --quiet ${{ matrix.commit }}^ ${{ matrix.commit }} && exit 0
          echo "::error::review-metadata.json not found: the review did not complete"
          exit 43

      - name: Collect Claude Code session files
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts aren't masked like the job log: drop the credentials that
          # Claude Code had in its environment.
          dir="$RUNNER_TEMP/claude-sessions"
          mkdir -p "$dir"
          cp -r ~/.claude/projects/. "$dir/" || true
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN GH_TOKEN; do
            if [ -n "${!var:-}" ]; then
              grep -rlF -e "${!var}" "$dir" | xargs -r perl -pi -e "s/\Q\$ENV{$var}\E/***/g" || true
            fi
          done

      - name: Upload Claude Code session files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: claude-sessions-${{ matrix.commit }}
          path: ${{ runner.temp }}/claude-sessions
          if-no-files-found: ignore
