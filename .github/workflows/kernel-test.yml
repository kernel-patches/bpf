name: Reusable test workflow

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
        description: The architecture to build against, e.g x86_64, aarch64, s390x...
      toolchain_full:
        required: true
        type: string
        description: The toolchain and for llvm, its version, e.g gcc, llvm-15
      runs_on:
        required: true
        type: string
        description: The runners to run the test on. This is a json string representing an array of labels.
      kernel:
        required: true
        type: string
        description: The kernel to run the test against. For KPD this is always LATEST, which runs against a newly built kernel.
      test:
        required: true
        type: string
        description: The test to run in the vm, e.g test_progs, test_maps, test_progs_no_alu32...
      continue_on_error:
        required: true
        type: string
        description: Whether to continue on error. This is typically set to true for parallel tests which are currently known to fail, but we don't want to fail the whole CI because of that.
      timeout_minutes:
        required: true
        type: number
        description: In case a test runs for too long, after how many seconds shall we timeout and error.
      llvm_version:
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.test }} on ${{ inputs.arch }} with ${{ inputs.toolchain_full }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 100
    env:
      ARCH: ${{ inputs.arch }}
      KERNEL: ${{ inputs.kernel }}
      REPO_ROOT: ${{ github.workspace }}
      REPO_PATH: ""
      # https://github.com/actions/runner/issues/1483#issuecomment-1031671517
      # booleans are weird in GH.
      CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
      DEPLOYMENT: ${{ github.repository == 'kernel-patches/bpf' && 'prod' || 'rc' }}
      ALLOWLIST_FILE: /tmp/allowlist
      DENYLIST_FILE: /tmp/denylist
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            ci

      - uses: actions/download-artifact@v7
        with:
          name: vmlinux-${{ inputs.arch }}-${{ inputs.toolchain_full }}
          path: .

      - name: Untar artifacts
        # zstd is installed by default in the runner images.
        run: zstd -d -T0  vmlinux-${{ inputs.arch }}-${{ inputs.toolchain_full }}.tar.zst --stdout | tar -xf -

      - name: Run selftests
        id: vmtest
        uses: libbpf/ci/run-vmtest@v4
        # Outcome is judged in "Report test outcome" below, which also
        # implements the CONTINUE_ON_ERROR semantic.
        continue-on-error: true
        timeout-minutes: ${{ inputs.timeout_minutes }}
        env:
          ARCH: ${{ inputs.arch }}
          DEPLOYMENT: ${{ env.DEPLOYMENT }}
          KERNEL_TEST: ${{ inputs.test }}
          LLVM_VERSION: ${{ inputs.llvm_version }}
          SELFTESTS_BPF: ${{ github.workspace }}/selftests/bpf
          VMTEST_CONFIGS: ${{ github.workspace }}/ci/vmtest/configs
          VMTEST_MEMORY: 5G
          VMTEST_NUM_CPUS: 4
          TEST_PROGS_TRAFFIC_MONITOR: ${{ inputs.arch == 'x86_64' && 'true' || '' }}
          TEST_PROGS_WATCHDOG_TIMEOUT: 600
        with:
          arch: ${{ inputs.arch }}
          vmlinuz: '${{ github.workspace }}/vmlinuz'
          kernel-root: ${{ env.REPO_ROOT }}
          max-cpu: 8
          # DEBUG DO-NOT-SEND: force the first attempt of the plain
          # s390x test_progs job to fail inside the VM (bogus test
          # name) to demonstrate the retry + flaky-annotation path.
          kernel-test: ${{ (inputs.arch == 's390x' && inputs.test == 'test_progs') && 'test_progs_debugflake' || inputs.test }}
          # Here we must use kbuild-output local to the repo, because
          # it was extracted from the artifacts.
          kbuild-output: ${{ env.REPO_ROOT }}/kbuild-output

      # s390x runners suffer from host-contention flakes (~6.5% of test
      # jobs fail on a single starved test; see the steal-time telemetry
      # in the job output). Retry a failed run once and annotate loudly,
      # so genuine flakes stop failing whole matrix runs while remaining
      # visible for tracking.
      - name: Retry selftests (s390x flake mitigation)
        id: vmtest-retry
        if: ${{ steps.vmtest.outcome == 'failure' && inputs.arch == 's390x' }}
        uses: libbpf/ci/run-vmtest@v4
        continue-on-error: true
        timeout-minutes: ${{ inputs.timeout_minutes }}
        env:
          ARCH: ${{ inputs.arch }}
          DEPLOYMENT: ${{ env.DEPLOYMENT }}
          KERNEL_TEST: ${{ inputs.test }}
          LLVM_VERSION: ${{ inputs.llvm_version }}
          SELFTESTS_BPF: ${{ github.workspace }}/selftests/bpf
          VMTEST_CONFIGS: ${{ github.workspace }}/ci/vmtest/configs
          VMTEST_MEMORY: 5G
          VMTEST_NUM_CPUS: 4
          TEST_PROGS_TRAFFIC_MONITOR: ${{ inputs.arch == 'x86_64' && 'true' || '' }}
          TEST_PROGS_WATCHDOG_TIMEOUT: 600
        with:
          arch: ${{ inputs.arch }}
          vmlinuz: '${{ github.workspace }}/vmlinuz'
          kernel-root: ${{ env.REPO_ROOT }}
          max-cpu: 8
          kernel-test: ${{ inputs.test }}
          kbuild-output: ${{ env.REPO_ROOT }}/kbuild-output

      - name: Report test outcome
        env:
          FIRST: ${{ steps.vmtest.outcome }}
          RETRY: ${{ steps.vmtest-retry.outcome }}
          TEST_ID: ${{ inputs.test }} on ${{ inputs.arch }} with ${{ inputs.toolchain_full }}
        run: |
          if [ "$FIRST" = "success" ]; then
            exit 0
          fi
          if [ "$RETRY" = "success" ]; then
            echo "::warning title=Flaky test job::${TEST_ID} failed on the first attempt and passed on retry"
            echo ":warning: **flaky**: ${TEST_ID} failed once, passed on retry" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RETRY" = "failure" ]; then
            echo "test job failed (both attempts)"
          else
            echo "test job failed"
          fi
          # https://github.com/actions/runner/issues/1483#issuecomment-1031671517
          # booleans are weird in GH.
          if [ "$CONTINUE_ON_ERROR" = "true" ]; then
            exit 0
          fi
          exit 1

      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tmon-logs-${{ inputs.arch }}-${{ inputs.toolchain_full }}-${{ inputs.test }}
          if-no-files-found: ignore
          path: /tmp/tmon_pcap/*
